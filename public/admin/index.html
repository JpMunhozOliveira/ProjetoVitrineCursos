<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel administrativo</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/theme.js"></script>
  <script src="../js/admin.js" defer></script>
</head>
<body data-admin="panel">
  <div class="container">
    <div class="admin-bar">
      <strong>Painel administrativo</strong>
      <div class="who"><span id="who" class="muted"></span>
        <button id="logout" class="btn btn-outline" type="button">Sair</button></div>
    </div>
    <main class="section">
      <h1>Cursos</h1>
      <p id="msg" class="msg" role="status" aria-live="polite">Carregando…</p>
      <div class="table-wrap">
        <table class="list" id="courses" hidden>
          <thead><tr><th>Título</th><th>Endereço (slug)</th><th>Situação</th><th>Atualizado em</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="muted">Cadastro, edição e exclusão pela tela chegam na próxima etapa.</p>
    </main>
  </div>
</body>
</html>
