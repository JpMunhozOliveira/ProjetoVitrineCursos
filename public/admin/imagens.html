<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Imagens — Painel administrativo</title>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../js/theme.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/imagens.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="admin-top">
      <header class="admin-bar">
        <div class="admin-id">
          <strong>Painel administrativo</strong>
          <span id="who" class="muted small"></span>
        </div>
        <div class="admin-actions">
          <button id="tema-btn" class="theme-btn" type="button" aria-label="Modo noturno" title="Modo noturno" aria-pressed="false"></button>
          <button id="logout" class="btn btn-outline btn-sm" type="button">Sair</button>
        </div>
      </header>
      <nav class="admin-nav" aria-label="Seções do painel">
        <a href="./">Resumo</a>
        <a href="produtos.html">Produtos</a>
        <a href="imagens.html" aria-current="page">Imagens</a>
        <a href="blocos.html">Blocos salvos</a>
        <a href="empresas.html">Empresas</a>
      </nav>
    </div>
    <main class="section">
      <div class="page-head">
        <div class="title-row">
          <h1>Imagens</h1>
          <span class="info-pop">
            <button class="info-btn" type="button" aria-label="Sobre esta página" aria-describedby="page-info" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
            <span id="page-info" class="info-text" role="tooltip">PNG, JPEG ou WebP, até 5 MB cada. As imagens são convertidas para WebP, reduzidas para no máximo 1600 px e têm os metadados (como localização GPS) removidos.</span>
          </span>
        </div>
        <label class="btn file-btn">Enviar imagens
          <input id="upload" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        </label>
      </div>

      <div id="search" class="search" role="search" hidden>
        <label for="q">Buscar imagens</label>
        <input id="q" type="search" placeholder="Nome, texto alternativo ou onde é usada" autocomplete="off" aria-describedby="count">
        <span id="count" class="hint" aria-live="polite"></span>
      </div>
      <div id="toolbar" class="media-toolbar" hidden>
        <span id="summary" class="muted"></span>
        <div class="field check">
          <input id="only-unused" type="checkbox">
          <label for="only-unused">Mostrar só as que não estão em uso</label>
        </div>
      </div>
      <p id="msg" class="msg" role="status" aria-live="polite">Carregando…</p>
      <p id="empty" class="empty muted" hidden></p>
      <ul id="library" class="media-library"></ul>
    </main>
  </div>
</body>
</html>
