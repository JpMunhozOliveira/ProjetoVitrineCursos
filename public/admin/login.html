<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Painel administrativo</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="../js/theme.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="auth">
    <div class="auth-top">
      <button id="tema-btn" class="theme-btn" type="button" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        <span>Modo noturno</span>
      </button>
    </div>
    <h1>Painel administrativo</h1>
    <noscript><p class="msg error">Ative o JavaScript para entrar.</p></noscript>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required></div>
      <p id="msg" class="msg error" role="alert"></p>
      <button id="submit" class="btn" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
