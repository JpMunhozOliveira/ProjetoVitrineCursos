<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre — Celetivo Cursos</title>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <meta name="description" content="Conheça a Celetivo Cursos: cursos e materiais para contadores e profissionais da área fiscal.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preload" href="/fonts/inter/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/theme.js"></script>
  <script src="data/site.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="sobre">
<noscript><div class="noscript-banner" role="alert"><strong>JavaScript desativado.</strong> Este site precisa do JavaScript para mostrar o menu, os produtos e o rodapé. Ative-o nas configurações do navegador e recarregue a página.</div></noscript>
<div id="site-header"></div>
<main id="conteudo">
  <section class="v-hero page-hero" aria-labelledby="t-sobre">
    <div class="container">
      <p class="v-eyebrow">Sobre</p>
      <h1 id="t-sobre" data-site="nome">Celetivo Cursos</h1>
      <p class="lead" data-site="slogan"></p>
    </div>
  </section>
  <section class="v-section is-light" aria-labelledby="t-quem-somos">
    <div class="container narrow about-text">
      <p class="v-eyebrow">Quem somos</p>
      <h2 id="t-quem-somos" data-site="sobre.titulo"></h2>
      <div id="sobre-texto"></div>
    </div>
  </section>
  <section class="v-section is-soft" aria-labelledby="t-valores">
    <div class="container">
      <p class="v-eyebrow">Como trabalhamos</p>
      <h2 id="t-valores">O que você pode esperar</h2>
      <div id="valores" class="features"></div>
    </div>
  </section>
  <section class="v-section is-dark" id="professor" aria-labelledby="t-professor" hidden>
    <div class="container about">
      <div id="foto-professor" class="photo"></div>
      <div>
        <p class="v-eyebrow">Quem ensina</p>
        <h2 id="t-professor" data-site="professor.nome"></h2>
        <p class="muted"><strong data-site="professor.cargo"></strong></p>
        <p data-site="professor.bio"></p>
      </div>
    </div>
  </section>
  <section class="v-strip" aria-label="Catálogo">
    <div class="container v-strip-row">
      <div><p class="v-eyebrow">Comece agora</p><p class="v-strip-text">Veja os cursos e materiais disponíveis.</p></div>
      <div class="v-strip-action"><a class="btn-cta" href="/catalogo.html">Ver o catálogo</a></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
