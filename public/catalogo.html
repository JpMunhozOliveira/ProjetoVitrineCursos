<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Instituto Celetivo</title>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <meta name="description" content="Todos os cursos e materiais do Instituto Celetivo. Busque por tema e escolha o seu.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preload" href="/fonts/inter/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/theme.js"></script>
  <script src="data/site.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/track.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="catalogo">
<noscript><div class="noscript-banner" role="alert"><strong>JavaScript desativado.</strong> Este site precisa do JavaScript para mostrar o menu, os produtos e o rodapé. Ative-o nas configurações do navegador e recarregue a página.</div></noscript>
<div id="site-header"></div>
<main id="conteudo">
  <section class="v-hero page-hero" aria-labelledby="t-catalogo">
    <div class="container">
      <p class="v-eyebrow">Catálogo</p>
      <h1 id="t-catalogo">Cursos e materiais</h1>
      <p class="lead">Conheça os cursos disponíveis e descubra novas possibilidades para sua trajetória. Clique em um produto para ver todos os detalhes.</p>
    </div>
  </section>
  <section class="v-section is-light" aria-label="Produtos">
    <div class="container">
      <div id="filtros" class="filters" role="search" aria-label="Filtrar produtos">
        <div>
          <label for="busca">Buscar produto</label>
          <input id="busca" type="search" placeholder="Digite um tema ou nome" autocomplete="off">
        </div>
        <div id="filtro-area">
          <label for="area">Área</label>
          <select id="area"><option value="">Todas</option></select>
        </div>
        <div id="filtro-categoria">
          <label for="categoria">Tipo</label>
          <select id="categoria"><option value="">Todas</option></select>
        </div>
      </div>
      <p id="resultado" class="muted" role="status" aria-live="polite"></p>
      <div id="catalogo" class="grid"><div class="skeleton-card" aria-hidden="true"></div><div class="skeleton-card" aria-hidden="true"></div><div class="skeleton-card" aria-hidden="true"></div></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
