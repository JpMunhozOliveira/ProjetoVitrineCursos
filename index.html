<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nome da Marca</title>
  <meta name="description" content="Cursos online do professor. Conheça o catálogo.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="data/cursos.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="home">
<div id="site-header"></div>
<main id="conteudo">
  <section class="hero">
    <div class="container">
      <p class="eyebrow">Cursos online</p>
      <h1 data-site="slogan">Slogan do projeto</h1>
      <p data-site="descricao"></p>
      <a class="btn" href="#cursos">Ver cursos</a>
    </div>
  </section>

  <section class="section" id="cursos" aria-labelledby="t-cursos">
    <div class="container">
      <h2 id="t-cursos">Cursos em destaque</h2>
      <div id="catalogo" class="grid"></div>
      <noscript><p>Ative o JavaScript para ver o catálogo de cursos.</p></noscript>
      <p class="more" id="ver-todos"><a class="btn" href="catalogo.html">Ver todos os cursos</a></p>
    </div>
  </section>

  <section class="section alt" id="sobre" aria-labelledby="t-sobre">
    <div class="container about">
      <div id="foto-professor" class="photo"></div>
      <div>
        <h2 id="t-sobre">Sobre <span data-site="professor.nome"></span></h2>
        <p data-site="professor.bio"></p>
      </div>
    </div>
  </section>

  <section class="section" id="contato" aria-labelledby="t-contato">
    <div class="container">
      <h2 id="t-contato">Contato</h2>
      <p>Tem alguma dúvida? Fale com a gente.</p>
      <ul id="contato-links" class="contact-list"></ul>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
