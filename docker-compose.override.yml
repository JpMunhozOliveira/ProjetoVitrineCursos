# Modo desenvolvimento (carregado automaticamente por `docker compose up`).
# Edite arquivos e veja o resultado sem reconstruir a imagem:
#  - frontend (public/): vale ao recarregar a página;
#  - API (server/): o Node reinicia sozinho (`node --watch`).
#    Se o reinício automático não disparar (comum com pastas do Windows em alguns
#    setups do Docker Desktop), use: docker compose restart app
services:
  migrate:
    volumes:
      - ./server/migrations:/app/migrations:ro   # novas migrations sem rebuild

  app:
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      PUBLIC_DIR: /frontend
    volumes:
      - ./server:/app
      - /app/node_modules          # mantém as dependências instaladas na imagem
      - ./public:/frontend:ro

  # Recompila o editor React (pasta editor/) a cada alteração e grava em public/admin/editor/,
  # que o app acima já serve. Em produção isso é feito dentro do Dockerfile.
  editor:
    image: node:22-alpine
    working_dir: /editor
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      EDITOR_POLLING: "1"
    volumes:
      - ./editor:/editor
      - /editor/node_modules       # dependências ficam no container, não no Windows/OneDrive
      - ./public/admin/editor:/public/admin/editor
